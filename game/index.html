<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comet Shepherd</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #070a18;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    touch-action: none;
    cursor: crosshair;
    box-shadow: 0 0 60px rgba(77, 227, 194, 0.12);
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Comet Shepherd: steer the skiff, bump comets into the gate of their colour, and guard the home star from void comets"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
